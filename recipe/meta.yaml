{% set name = "azure-mgmt-cosmosdb" %}
{% set version = "10.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c781d42a655e60717a134ac14f2bc24af6f00cd86207d3fe93deeefb24ca40a9

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - azure-common >=1.1,<2
    - azure-mgmt-core >=1.6.0,<2.0.0
    - msrest >=0.7.1

test:
  imports:
    - azure.mgmt.cosmosdb
    - azure.mgmt.cosmosdb.aio
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Cosmos DB Management Client Library for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - awvwgk
